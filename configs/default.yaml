# Screen Capture — Configuration
# Copy to ~/.screen-capture/config.yaml and customize

# Role & context (shapes analysis tone and focus)
role: ""                          # e.g., "Engineering Manager", "Product Manager"
company: ""                       # e.g., "Acme Corp"
focus_areas: []                   # e.g., ["code review throughput", "team coaching"]

# Coaching priorities (what feedback should emphasize)
coaching: []                      # e.g., ["deep work protection", "meeting effectiveness"]

# Persona — gates persona-specific analysis. "" = default day-level analysis only.
# "support" = also run ticket-centric analysis (anchor → spread → switch attribution).
persona: ""                       # "" | support

# Capture settings
capture:
  interval_seconds: 30            # Screenshot frequency
  idle_timeout_minutes: 30        # Skip capture when idle this long
  retention_days: 7               # Auto-delete raw screenshots after N days
  quality: 30                     # JPEG quality (1-100, lower = smaller files)
  width: 1280                     # Resize width in pixels
  exclude_apps: []                # Apps to never capture, e.g., ["1Password", "Messages"]
  exclude_windows: []              # Window title patterns to skip, e.g., ["*password*", "*banking*"]

  # App classification for time-allocation scoring
  # productive: core role work | neutral: supporting work | private: never captured
  app_categories:
    productive: []    # e.g., ["VS Code", "Figma", "Salesforce"]
    neutral: []       # e.g., ["Slack", "Gmail", "Calendar"]
    private: []       # e.g., ["1Password", "Messages"] — treated same as exclude_apps

# Analysis settings
analysis:
  schedule_hour: 23               # Hour to run analysis (24h format)
  schedule_days: "1,2,3,4,5"     # Days of week (1=Mon, 7=Sun)
  model: opus                     # Claude model: opus | sonnet
  meeting_source: none            # none | granola

# Support persona — only used when persona: support
support:
  # Anchor patterns. Each entry is regex with capture groups; id_format uses {1}, {2}, ...
  # Match against `url` (url_match) or `window_title` (title_match) from .meta.json sidecars.
  ticket_patterns: []
  # Time window to attribute work before/after a visible ticket anchor.
  spread_window_minutes: 15
  # Switches shorter than this are treated as noise, not real context switches.
  switch_noise_threshold_seconds: 120
  # Retro-attach diagnostic work that happened before the ticket was opened.
  pre_ticket_attribution: true
  # How to bucket work that has no ticket ID: "slug" (one folder per topic) or "flat" (single log).
  untracked_bucketing: slug
  # Minimum continuous time on a ticket before generating per-ticket docs.
  min_session_seconds: 60

# PII redaction in output markdown (raw screenshots are never altered)
redaction:
  redact_person_names: false      # Substitute role-based references ("the customer", "an engineer")
  redact_account_names: false     # Substitute generic placeholders for customer/account names

# Confluence publishing (used by scripts/publish.sh)
publish:
  confluence:
    enabled: false
    cloud_id: ""                  # e.g., "yourorg.atlassian.net"
    space_key: ""                 # e.g., "ST"
    parent_id: ""                 # Page or folder ID under which ticket pages are nested
    title_prefix: ""              # Optional prefix prepended to every page title

# Output
output:
  directory: ~/screen-capture     # Where analysis markdown files go
