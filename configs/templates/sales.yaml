# Screen Capture — Sales Template

role: "Account Executive"
company: ""
focus_areas:
  - pipeline progression and deal management
  - prospecting and outreach effectiveness
  - demo and presentation preparation

coaching:
  - selling time vs admin time ratio
  - deal preparation quality
  - follow-up discipline

capture:
  interval_seconds: 30
  idle_timeout_minutes: 30
  retention_days: 7
  quality: 30
  width: 1280
  exclude_apps: []
  exclude_windows: []              # Window title patterns to skip, e.g., ["*password*", "*banking*"]

  # App classification for time-allocation scoring
  # productive: core role work | neutral: supporting work | private: never captured
  app_categories:
    productive: ["Salesforce", "Outreach", "Zoom", "LinkedIn", "Gong"]
    neutral: ["Slack", "Gmail", "Google Chrome", "Arc", "Google Docs"]
    private: []       # e.g., ["1Password", "Messages"] — treated same as exclude_apps

analysis:
  schedule_hour: 23
  schedule_days: "1,2,3,4,5"
  model: opus
  meeting_source: none

output:
  directory: ~/screen-capture
