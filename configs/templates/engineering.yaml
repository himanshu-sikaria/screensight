# Screen Capture — Engineering Template

role: "Software Engineer"
company: ""
focus_areas:
  - deep work and coding output
  - code review throughput
  - architecture decisions

coaching:
  - deep work protection
  - meeting load management
  - context switching reduction

capture:
  interval_seconds: 30
  idle_timeout_minutes: 30
  retention_days: 7
  quality: 30
  width: 1280
  exclude_apps: []
  exclude_windows: []              # Window title patterns to skip, e.g., ["*password*", "*banking*"]

  # App classification for time-allocation scoring
  # productive: core role work | neutral: supporting work | private: never captured
  app_categories:
    productive: ["VS Code", "Terminal", "iTerm2", "Xcode", "GitHub Desktop"]
    neutral: ["Slack", "Gmail", "Google Chrome", "Arc", "Zoom", "Notion"]
    private: []       # e.g., ["1Password", "Messages"] — treated same as exclude_apps

analysis:
  schedule_hour: 23
  schedule_days: "1,2,3,4,5"
  model: opus
  meeting_source: none

output:
  directory: ~/screen-capture
