# Screen Capture — Customer Success Template

role: "Customer Success Manager"
company: ""
focus_areas:
  - customer engagement and health monitoring
  - renewal and expansion preparation
  - cross-functional escalation management

coaching:
  - proactive vs reactive time allocation
  - customer-facing time ratio
  - internal process efficiency

capture:
  interval_seconds: 30
  idle_timeout_minutes: 30
  retention_days: 7
  quality: 30
  width: 1280
  exclude_apps: []
  exclude_windows: []              # Window title patterns to skip, e.g., ["*password*", "*banking*"]

  # App classification for time-allocation scoring
  # productive: core role work | neutral: supporting work | private: never captured
  app_categories:
    productive: ["Salesforce", "Vitally", "Zoom", "Google Docs", "Gong"]
    neutral: ["Slack", "Gmail", "Google Chrome", "Arc", "Notion"]
    private: []       # e.g., ["1Password", "Messages"] — treated same as exclude_apps

analysis:
  schedule_hour: 23
  schedule_days: "1,2,3,4,5"
  model: opus
  meeting_source: none

output:
  directory: ~/screen-capture
